<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Force Update Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  body { display: flex; padding: 40px; background: #1a2438; min-height: 100vh; align-items: center; justify-content: center; }
  .phone { width: 380px; height: 760px; background: #0B1A2E; border-radius: 44px; border: 8px solid #222; position: relative; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 320px; background: #0B1A2E; border: 1px solid #1E3A5F; border-radius: 20px; padding: 28px; text-align: center; }
  .icon-wrap { width: 80px; height: 80px; border-radius: 40px; background: rgba(36, 140, 204, 0.15); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px; font-size: 40px; }
  .title { font-weight: 700; font-size: 24px; margin-bottom: 14px; color: #FFFFFF; }
  .message { font-weight: 400; font-size: 15px; line-height: 1.6; margin-bottom: 26px; color: #A0B4CC; }
  .btn-primary { display: block; width: 100%; padding: 16px; background: #248CCC; color: white; border-radius: 12px; font-weight: 700; font-size: 16px; border: none; cursor: pointer; }
</style>
</head>
<body>
  <div class="phone">
    <div class="backdrop">
      <div class="card">
        <div class="icon-wrap">⬆️</div>
        <div class="title">تحديث متوفر</div>
        <div class="message">يتوفر إصدار جديد من تطبيق Xmart بمزايا وتحسينات جديدة. يرجى التحديث للاستمرار.</div>
        <button class="btn-primary">تحديث الآن</button>
      </div>
    </div>
  </div>
</body>
</html>
